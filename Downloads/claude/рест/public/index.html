<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Número Uno Steakhouse · Reservas</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --panel-2: #1c1c1c;
      --red: #e30613;
      --red-soft: rgba(227, 6, 19, 0.15);
      --text: #f5f5f5;
      --muted: #9a9a9a;
      --line: #2a2a2a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100dvh;
    }
    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: var(--bg);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    header {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
      background: #000;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 0.95;
      font-size: 20px;
      text-transform: uppercase;
    }
    .logo b { color: var(--red); }
    .logo small {
      display: block;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--muted);
      font-weight: 600;
    }
    .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #35c759; box-shadow: 0 0 8px #35c759; }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .msg { max-width: 82%; padding: 11px 14px; border-radius: 16px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
    .bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
    .user { align-self: flex-end; background: var(--red); color: #fff; border-bottom-right-radius: 5px; }

    .typing { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; border-bottom-left-radius: 5px; padding: 13px 16px; display: none; }
    .typing.show { display: flex; gap: 4px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }

    .booking {
      align-self: flex-start;
      max-width: 92%;
      background: linear-gradient(180deg, #1e1e1e, #171717);
      border: 1px solid var(--red);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 0 24px var(--red-soft);
    }
    .booking h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--red); }
    .booking .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
    .booking .row:last-of-type { border-bottom: 0; }
    .booking .row b { color: var(--muted); font-weight: 500; }
    .booking a.confirm {
      display: block;
      margin-top: 14px;
      background: var(--red);
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      padding: 13px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }
    .booking a.confirm:active { transform: scale(0.98); }
    .booking .hint { margin: 9px 2px 0; font-size: 11.5px; color: var(--muted); line-height: 1.4; }

    form { display: flex; gap: 8px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #000; }
    input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 13px 16px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--red); }
    button.send {
      background: var(--red);
      border: 0;
      color: #fff;
      width: 48px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    button.send:disabled { opacity: 0.5; }
    .demo-badge { text-align: center; font-size: 11px; color: var(--muted); padding: 6px; background: #000; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">NÚMER<b>O</b><br />UNO<small>STEAKHOUSE</small></div>
      <div class="status"><span class="dot"></span>En línea</div>
    </header>

    <div class="chat" id="chat"></div>
    <div class="typing" id="typing"><span></span><span></span><span></span></div>

    <form id="form" autocomplete="off">
      <input id="input" placeholder="Escribe tu mensaje…" autofocus />
      <button class="send" id="send" type="submit" aria-label="Enviar">➤</button>
    </form>
    <div class="demo-badge">Demo · Número Uno Steakhouse</div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const typing = document.getElementById('typing');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    // История диалога живёт на клиенте (сервер без состояния).
    const messages = [];

    function scrollDown() { chat.scrollTop = chat.scrollHeight; }

    function addBubble(role, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
      el.textContent = text;
      chat.appendChild(el);
      scrollDown();
    }

    function addBookingCard(b) {
      const el = document.createElement('div');
      el.className = 'booking';
      const prefillHint = b.datePrefill
        ? 'Se abre el widget de reservas con la fecha ya puesta. Recibirás el email de confirmación como siempre.'
        : 'Se abre la página de reservas del restaurante para confirmar tu mesa.';
      el.innerHTML = `
        <h4>Resumen de tu reserva</h4>
        <div class="row"><b>Restaurante</b><span>${b.restaurant}</span></div>
        <div class="row"><b>Dirección</b><span>${b.address}</span></div>
        <div class="row"><b>Fecha</b><span>${b.date || '—'}</span></div>
        <div class="row"><b>Hora</b><span>${b.time || '—'}</span></div>
        <div class="row"><b>Personas</b><span>${b.guests ?? '—'}</span></div>
        <div class="row"><b>Nombre</b><span>${b.name || '—'}</span></div>
        <a class="confirm" href="${b.url}" target="_blank" rel="noopener">Confirmar reserva</a>
        <p class="hint">${prefillHint}</p>`;
      chat.appendChild(el);
      scrollDown();
    }

    async function sendMessage(text) {
      addBubble('user', text);
      messages.push({ role: 'user', content: text });
      typing.classList.add('show');
      scrollDown();
      send.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages }),
        });
        const data = await res.json();
        typing.classList.remove('show');

        if (!res.ok) {
          addBubble('bot', 'Perdona, un problemilla técnico. Inténtalo otra vez. · Sorry, a technical glitch. Please try again.');
          return;
        }
        const reply = data.reply || '';
        if (reply) {
          addBubble('bot', reply);
          messages.push({ role: 'assistant', content: reply });
        }
        if (data.booking) addBookingCard(data.booking);
      } catch (e) {
        typing.classList.remove('show');
        addBubble('bot', 'No he podido conectar. Revisa tu conexión. · Couldn’t connect. Check your connection.');
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendMessage(text);
    });

    // Приветствие бота (ES, как основной язык сайта). Не идёт в историю модели —
    // просто первый экран; модель сама подстроит язык под первое сообщение гостя.
    addBubble('bot', '¡Hola! Soy el asistente de Número Uno Steakhouse. Puedo ayudarte con el menú, los horarios o reservar mesa en cualquiera de nuestros tres restaurantes. ¿Qué te apetece? · Hi! I can also help you in English.');
  </script>
</body>
</html>
